<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta
      name="description"
      content="Resultado da conversa Belvitale CeluClin, sem diagnóstico, avaliação corporal ou promessa de resultado."
    />
    <title>Seu ritmo de autocuidado | Belvitale</title>
    <style>
      body { margin: 0; color: #fff; background: #5a1837; font-family: Arial, sans-serif; }
      .result-bootstrap { width: min(calc(100% - 2.5rem), 78rem); min-height: 100vh; margin: auto; }
      .result-bootstrap header { display: flex; min-height: 4.25rem; align-items: center; justify-content: space-between; border-bottom: 1px solid rgb(255 255 255 / 28%); }
      .result-bootstrap header a { color: inherit; font: 700 1.4rem Georgia, serif; text-decoration: none; }
      .result-bootstrap main { display: flex; min-height: calc(100vh - 4.25rem); padding-block: 2rem; flex-direction: column; justify-content: center; }
      .result-bootstrap small { color: #ffc6df; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
      .result-bootstrap h1 { max-width: 10ch; margin: .7rem 0 0; font: 600 clamp(3.3rem, 14vw, 8rem) / .86 Georgia, serif; letter-spacing: -.05em; }
      .result-bootstrap p { max-width: 34rem; color: #f1cfdd; line-height: 1.55; }
      .result-bootstrap a[href="/quiz"] { display: inline-flex; width: fit-content; min-height: 3.25rem; margin-top: 1rem; padding-inline: 1.2rem; align-items: center; color: white; background: #d90a73; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="result-bootstrap">
        <header><a href="/">belvitale</a><span>CeluClin · seu ritmo</span></header>
        <main>
          <small>Resultado incompleto</small>
          <h1>Seu resultado precisa das 12 escolhas.</h1>
          <p>
            Nenhuma leitura é criada sem respostas válidas. A experiência não
            diagnostica, avalia o corpo ou recomenda tratamento.
          </p>
          <a href="/quiz">Começar o quiz</a>
        </main>
      </div>
    </div>
    <script type="module" src="/src/quiz-main.tsx"></script>
  </body>
</html>
